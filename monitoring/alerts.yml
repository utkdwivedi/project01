groups:
  - name: project01-availability
    rules:
      - alert: Project01HealthProbeFailing
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Project01 health endpoint is failing"
          description: "The HTTP probe for {{ $labels.instance }} has failed for at least two minutes."

      - alert: Project01HealthProbeSlow
        expr: probe_duration_seconds{job="blackbox-http"} > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Project01 health endpoint is slow"
          description: "The HTTP probe for {{ $labels.instance }} has exceeded one second for five minutes."
